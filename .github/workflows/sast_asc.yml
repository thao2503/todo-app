name: Trivy Full Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan-code:
    name: Scan Source Code (SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          skip-version-check: true

      - name: Run Trivy FS scan (JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs.json
          severity: HIGH,CRITICAL
          skip-version-check: true

      - name: Convert Trivy JSON → HTML
        run: |
          python3 << 'PYEOF'
          import json, glob

          def convert(input_file, output_file, title):
            try:
              data = json.load(open(input_file))
            except:
              data = {}

            results = data.get("Results", [])
            all_vulns = []
            for r in results:
              target = r.get("Target", "")
              for v in r.get("Vulnerabilities") or []:
                v["_target"] = target
                all_vulns.append(v)

            sev_color = {
              "CRITICAL": "#7c0000", "HIGH": "#c0392b",
              "MEDIUM": "#e67e22", "LOW": "#2980b9", "UNKNOWN": "#7f8c8d"
            }
            sev_order = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "UNKNOWN": 4}
            all_vulns.sort(key=lambda x: sev_order.get(x.get("Severity", "UNKNOWN"), 9))

            critical = sum(1 for v in all_vulns if v.get("Severity") == "CRITICAL")
            high = sum(1 for v in all_vulns if v.get("Severity") == "HIGH")

            rows = ""
            for v in all_vulns:
              sev = v.get("Severity", "UNKNOWN")
              color = sev_color.get(sev, "#7f8c8d")
              url = v.get("PrimaryURL", "#")
              vid = v.get("VulnerabilityID", "")
              rows += f"""<tr>
                <td><code>{v.get('_target','')}</code></td>
                <td><code>{v.get('PkgName','')}</code></td>
                <td><a href="{url}" target="_blank">{vid}</a></td>
                <td><span style="background:{color};color:white;padding:2px 8px;border-radius:3px;font-size:.75rem">{sev}</span></td>
                <td>{v.get('InstalledVersion','')}</td>
                <td>{v.get('FixedVersion','')}</td>
                <td style="max-width:300px">{v.get('Title','')}</td>
              </tr>"""

            no_vuln = '<p style="color:#27ae60;font-size:1rem">&#10003; No vulnerabilities found.</p>'
            table = f"""<table>
              <thead><tr><th>Target</th><th>Package</th><th>CVE</th><th>Severity</th><th>Installed</th><th>Fixed</th><th>Title</th></tr></thead>
              <tbody>{rows}</tbody>
            </table>""" if all_vulns else no_vuln

            html = f"""<!DOCTYPE html><html><head><meta charset="UTF-8">
            <title>{title}</title>
            <style>
              body{{font-family:sans-serif;padding:24px;background:#fafafa;margin:0}}
              h2{{color:#1a1a2e}}
              .stats{{display:flex;gap:16px;margin-bottom:24px}}
              .stat{{background:white;border-radius:8px;padding:16px 24px;box-shadow:0 1px 4px rgba(0,0,0,.1)}}
              .stat .num{{font-size:2rem;font-weight:bold}}
              .stat .label{{color:#888;font-size:.85rem}}
              table{{width:100%;border-collapse:collapse;background:white;box-shadow:0 1px 4px rgba(0,0,0,.1);border-radius:8px;overflow:hidden}}
              th{{background:#1a1a2e;color:white;padding:10px 14px;text-align:left;font-size:.85rem}}
              td{{padding:10px 14px;border-bottom:1px solid #eee;font-size:.85rem;vertical-align:top}}
              tr:last-child td{{border-bottom:none}}
              tr:hover td{{background:#f5f5f5}}
              a{{color:#0f3460}}
            </style>
            </head><body>
            <h2>{title}</h2>
            <div class="stats">
              <div class="stat"><div class="num">{len(all_vulns)}</div><div class="label">Total</div></div>
              <div class="stat"><div class="num" style="color:#7c0000">{critical}</div><div class="label">Critical</div></div>
              <div class="stat"><div class="num" style="color:#c0392b">{high}</div><div class="label">High</div></div>
            </div>
            {table}
            </body></html>"""

            open(output_file, "w").write(html)
            print(f"{output_file}: {len(all_vulns)} findings ({critical} critical, {high} high)")

          convert("trivy-fs.json", "trivy-fs.html", "Trivy FS Scan")
          PYEOF

      - name: Upload FS scan result (SARIF)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload FS HTML report
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy-fs
          path: trivy-fs.html
          retention-days: 30

  sast-codeql-python:
    name: SAST — CodeQL (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-python
          output: codeql-python.sarif

      - name: Upload CodeQL Python SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-codeql-python
          path: codeql-python.sarif
          retention-days: 30

  sast-codeql-javascript:
    name: SAST — CodeQL (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-javascript
          output: codeql-javascript.sarif

      - name: Upload CodeQL JS SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-codeql-javascript
          path: codeql-javascript.sarif
          retention-days: 30

  sast-semgrep:
    name: SAST — Semgrep (Python)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (SARIF)
        run: |
          semgrep scan \
            --config p/python \
            --config p/flask \
            --config p/django \
            --config p/jwt \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            ./backend

      - name: Upload Semgrep result (SARIF)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-python

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          retention-days: 30

  scan-backend-image:
    name: Scan backend Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t todo-backend ./backend

      - name: Run Trivy image scan — backend (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: todo-backend
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
