              color = sev_color.get(sev, "#7f8c8d")
              url = v.get("PrimaryURL", "#")
              vid = v.get("VulnerabilityID", "")
              rows += f"""<tr>
                <td><code>{v.get('_target','')}</code></td>
                <td><code>{v.get('PkgName','')}</code></td>
