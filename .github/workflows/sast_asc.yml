  generate-report:
    name: Generate Combined HTML Report
    runs-on: ubuntu-latest
    needs:
      - scan-code
      - sast-codeql-python
      - sast-codeql-javascript
      - sast-semgrep
      - scan-backend-image
      - scan-frontend-image

    steps:
      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sarif-*
          merge-multiple: true
          path: sarif-files/

      - name: Download all Trivy HTML reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-trivy-*
          merge-multiple: true
          path: trivy-reports/

      - name: Convert SARIF → HTML (CodeQL + Semgrep)
        run: |
          python3 << 'PYEOF'
          import json, glob, os

          findings = []

          for sarif_file in glob.glob("sarif-files/*.sarif"):
            source = os.path.basename(sarif_file).replace(".sarif", "")
            try:
              data = json.load(open(sarif_file))
              for run in data.get("runs", []):
                tool = run.get("tool", {}).get("driver", {}).get("name", source)
                rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
                for result in run.get("results", []):
                  rule_id = result.get("ruleId", "N/A")
                  rule = rules.get(rule_id, {})
                  severity = result.get("properties", {}).get("problem.severity") \
                          or rule.get("properties", {}).get("problem.severity", "unknown")
                  message = result.get("message", {}).get("text", "")
                  locations = result.get("locations", [])
                  loc_str = ""
                  if locations:
                    pl = locations[0].get("physicalLocation", {})
                    uri = pl.get("artifactLocation", {}).get("uri", "")
                    line = pl.get("region", {}).get("startLine", "")
                    loc_str = f"{uri}:{line}" if line else uri
                  findings.append({
                    "tool": tool,
                    "rule_id": rule_id,
                    "severity": severity.upper(),
                    "message": message[:200],
                    "location": loc_str,
                  })
            except Exception as e:
              print(f"Warning: could not parse {sarif_file}: {e}")

          sev_order = {"CRITICAL": 0, "HIGH": 1, "ERROR": 1, "MEDIUM": 2, "WARNING": 2, "LOW": 3, "UNKNOWN": 4}
          findings.sort(key=lambda x: sev_order.get(x["severity"], 9))

          sev_color = {
            "CRITICAL": "#7c0000", "HIGH": "#c0392b", "ERROR": "#c0392b",
            "MEDIUM": "#e67e22", "WARNING": "#e67e22",
            "LOW": "#2980b9", "UNKNOWN": "#7f8c8d"
          }

          rows = ""
          for f in findings:
            color = sev_color.get(f["severity"], "#7f8c8d")
            rows += f"""<tr>
              <td><code style="font-size:0.8rem">{f['tool']}</code></td>
              <td><span style="background:{color};color:white;padding:2px 8px;border-radius:3px;font-size:0.75rem">{f['severity']}</span></td>
              <td><code style="font-size:0.8rem">{f['rule_id']}</code></td>
              <td style="max-width:400px;font-size:0.85rem">{f['message']}</td>
              <td><code style="font-size:0.75rem;color:#555">{f['location']}</code></td>
            </tr>"""

          total = len(findings)
          critical = sum(1 for f in findings if f["severity"] == "CRITICAL")
          high = sum(1 for f in findings if f["severity"] in ("HIGH", "ERROR"))

          no_vuln = '<p style="color:#27ae60">&#10003; No findings detected.</p>'
          table = f"""<table>
            <thead><tr><th>Tool</th><th>Severity</th><th>Rule</th><th>Message</th><th>Location</th></tr></thead>
            <tbody>{rows}</tbody>
          </table>""" if findings else no_vuln

          html = f"""<!DOCTYPE html><html><head><meta charset="UTF-8">
          <title>SAST Report</title>
          <style>
            body{{font-family:sans-serif;padding:24px;background:#fafafa}}
            h2{{color:#1a1a2e}}
            .stats{{display:flex;gap:16px;margin-bottom:24px}}
            .stat{{background:white;border-radius:8px;padding:16px 24px;box-shadow:0 1px 4px rgba(0,0,0,.1)}}
            .stat .num{{font-size:2rem;font-weight:bold}}
            .stat .label{{color:#888;font-size:.85rem}}
            table{{width:100%;border-collapse:collapse;background:white;box-shadow:0 1px 4px rgba(0,0,0,.1);border-radius:8px;overflow:hidden}}
            th{{background:#1a1a2e;color:white;padding:10px 14px;text-align:left;font-size:.85rem}}
            td{{padding:10px 14px;border-bottom:1px solid #eee;vertical-align:top}}
            tr:last-child td{{border-bottom:none}}
            tr:hover td{{background:#f5f5f5}}
          </style>
          </head><body>
          <h2>SAST Report — CodeQL + Semgrep</h2>
          <div class="stats">
            <div class="stat"><div class="num">{total}</div><div class="label">Total findings</div></div>
            <div class="stat"><div class="num" style="color:#7c0000">{critical}</div><div class="label">Critical</div></div>
            <div class="stat"><div class="num" style="color:#c0392b">{high}</div><div class="label">High / Error</div></div>
          </div>
          {table}
          </body></html>"""

          open("sarif-summary.html", "w").write(html)
          print(f"Done: {total} findings ({critical} critical, {high} high)")
          PYEOF

      - name: Build combined report
        run: |
          python3 << 'PYEOF'
          import os, glob, datetime

          pages = {}

          for f in sorted(glob.glob("trivy-reports/*.html")):
            name = os.path.basename(f).replace(".html", "").replace("trivy-", "Trivy: ")
            pages[name] = open(f).read()

          if os.path.exists("sarif-summary.html"):
            pages["SAST (CodeQL + Semgrep)"] = open("sarif-summary.html").read()

          now = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          tabs_nav = ""
          tabs_content = ""
          for i, (name, content) in enumerate(pages.items()):
            active = "active" if i == 0 else ""
            tab_id = f"tab{i}"
            tabs_nav += f'<button class="tab-btn {active}" onclick="showTab(\'{tab_id}\')">{name}</button>\n'
            display = "block" if i == 0 else "none"
            tabs_content += f'<div id="{tab_id}" class="tab-content" style="display:{display}">{content}</div>\n'

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Security Scan Report</title>
            <style>
              body {{ font-family: sans-serif; margin: 0; background: #f4f4f4; }}
              header {{ background: #1a1a2e; color: white; padding: 20px 30px; }}
              header h1 {{ margin: 0; font-size: 1.4rem; }}
              header small {{ opacity: 0.6; }}
              .tabs {{ display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 30px; background: #16213e; }}
              .tab-btn {{ padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
                          background: #0f3460; color: white; font-size: 0.85rem; }}
              .tab-btn.active {{ background: #e94560; }}
              .tab-content {{ padding: 24px 30px; }}
            </style>
          </head>
          <body>
            <header>
              <h1>&#128274; Security Scan Report</h1>
              <small>Generated: {now}</small>
            </header>
            <div class="tabs">{tabs_nav}</div>
            {tabs_content}
            <script>
              function showTab(id) {{
                document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                document.getElementById(id).style.display = 'block';
                event.target.classList.add('active');
              }}
            </script>
          </body>
          </html>"""

          open("security-report.html", "w").write(html)
          print("Report generated: security-report.html")
          PYEOF

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html
          retention-days: 30